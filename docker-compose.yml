services:
  bot:
    build: .
    image: ghcr.io/hakunamaruna/node-monitor-bot:latest
    env_file: .env
    environment:
      DB_URL: sqlite+aiosqlite:///./data/nodes.db
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - bot-data:/app/data
    restart: always
    # Контейнеру не нужны привилегии и запись в корневую ФС.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

volumes:
  bot-data:
